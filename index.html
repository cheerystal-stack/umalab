<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><title>UMA LAB α｜CSV研究室</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#243c32;background:#faf7ef}*{box-sizing:border-box}body{margin:0}header{background:#173f35;color:#fff8e8;padding:30px 20px 22px;text-align:center;border-bottom:5px solid #c8a76a}header small{letter-spacing:.2em;color:#d9c59a}h1{font-family:Georgia,serif;letter-spacing:.12em;margin:6px 0;font-size:36px}header p{margin:4px;font-size:12px}main{max-width:720px;margin:auto;padding:18px 14px 60px}.panel{background:white;border:1px solid #e4d8bf;border-radius:17px;padding:18px;margin:0 0 15px;box-shadow:0 3px 12px #382a1710}h2{font-size:17px;margin:0 0 13px}label{display:block;font-size:13px;margin:12px 0 5px;font-weight:700}input[type=file]{width:100%;font-size:13px;padding:10px;border:1px dashed #b3a382;border-radius:10px;background:#f9f7f0}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:#205144;color:white}button.secondary{background:#f1e9d7;color:#365046}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.muted{color:#786f61;font-size:12px;line-height:1.6}.race{background:#f4f0e5;padding:13px;border-radius:11px;line-height:1.7}.horse{width:100%;text-align:left;background:white;color:#263e33;border:1px solid #e4d8bf;display:flex;align-items:center;gap:12px;margin:8px 0;padding:13px}.num{display:grid;place-items:center;flex:none;width:37px;height:37px;border-radius:8px;background:#e8eee8;font-size:17px}.horse strong{display:block}.horse small{color:#7b7468}.arrow{margin-left:auto;color:#ae8c50}.hidden{display:none}.details{line-height:1.85}.details dl{display:grid;grid-template-columns:105px 1fr;margin:0;gap:6px;font-size:14px}.details dt{color:#776b5b}.details dd{margin:0;overflow-wrap:anywhere}.status{font-size:13px;color:#3b6855;white-space:pre-line}.warn{color:#a04830}.top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:11px;color:#876d37;border:1px solid #c7b17d;border-radius:99px;padding:3px 8px}@media(min-width:600px){.horse{padding:16px}}
</style></head><body><header><small>RACE RESEARCH LAB</small><h1>UMA LAB</h1><p>CSV IMPORT EXPERIMENT · α 0.1</p></header><main><section class="panel"><div class="top"><h2>🧪 データを取り込む</h2><span class="tag">LOCAL ONLY</span></div><p class="muted">CSVは端末内で読み込みます。3種類のファイルを選択してください。過去走CSVはヘッダーのみでもOK。</p><label for="races">① レース情報 · races.csv</label><input id="races" type="file" accept=".csv,text/csv"><label for="entries">② 出走馬情報 · entries.csv</label><input id="entries" type="file" accept=".csv,text/csv"><label for="runs">③ 過去走情報 · past_runs.csv（任意）</label><input id="runs" type="file" accept=".csv,text/csv"><div class="buttons"><button id="import">CSVを読み込む</button><button id="demo" class="secondary">同梱サンプルを表示</button></div><p id="status" class="status" role="status"></p></section><section id="results" class="hidden"><section class="panel"><h2>🏇 レース情報</h2><div id="raceInfo" class="race"></div></section><section class="panel"><div class="top"><h2>🐴 出走馬一覧</h2><span id="count" class="tag"></span></div><div id="horses"></div></section><section id="detailPanel" class="panel hidden"><h2>🤍 しろねの馬データ研究ノート</h2><div id="details" class="details"></div></section></section><section class="panel"><h2>💾 保存・バックアップ</h2><p class="muted">インポート後はこのブラウザ内に保存します。Safariの履歴やサイトデータを消すと失われることがあるため、バックアップも残してね。</p><div class="buttons"><button id="export" class="secondary">JSONバックアップ</button><button id="clear" class="secondary">保存データを削除</button></div></section></main><script>
'use strict';const $=id=>document.getElementById(id),key='uma_lab_alpha_v1';let db={races:[],entries:[],runs:[]};const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function parseCSV(t){t=t.replace(/^\uFEFF/,'');let rows=[],row=[],v='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(x=>x!==''))rows.push(row);row=[];v=''}else v+=c}if(quoted)throw Error('CSVの引用符が閉じていません');if(v!==''||row.length){row.push(v);rows.push(row)}if(!rows.length)return[];const header=rows.shift().map(s=>s.trim());if(header.some(h=>!h)||new Set(header).size!==header.length)throw Error('CSVヘッダーが不正です');return rows.map((r,i)=>{if(r.length!==header.length)throw Error(`${i+2}行目の列数が一致しません`);return Object.fromEntries(header.map((h,j)=>[h,r[j]]))})}function validate(d){if(!d.races.length)throw Error('レース情報がありません');if(!d.entries.length)throw Error('出走馬がありません');for(let [type,fields] of Object.entries({races:['race_id','date','venue','race_number'],entries:['race_id','horse_number','horse_name'],runs:['horse_name','race_date']})){if(!d[type].length)continue;for(let f of fields)if(!(f in d[type][0]))throw Error(`${type}.csv に ${f} 列がありません`)}let ids=new Set(d.races.map(r=>r.race_id));if(d.entries.some(e=>!ids.has(e.race_id)))throw Error('出走馬のrace_idに対応するレースがありません')}function setStatus(s,error=false){$('status').textContent=s;$('status').className='status'+(error?' warn':'')}function render(){if(!db.races.length||!db.entries.length)return;$('results').classList.remove('hidden');const r=db.races[0];$('raceInfo').innerHTML=`<strong>${escapeHTML(r.date)}｜${escapeHTML(r.venue)} ${escapeHTML(r.race_number)}R</strong><br>${escapeHTML(r.race_name)}<br>${escapeHTML(r.surface)} ${escapeHTML(r.distance_m)}m · ${escapeHTML(r.direction)}回り · 発走 ${escapeHTML(r.start_time)}`;const horses=db.entries.filter(e=>e.race_id===r.race_id).sort((a,b)=>Number(a.horse_number)-Number(b.horse_number));$('count').textContent=horses.length+'頭';$('horses').replaceChildren();for(const h of horses){const b=document.createElement('button');b.className='horse';b.innerHTML=`<span class="num">${escapeHTML(h.horse_number)}</span><span><strong>${escapeHTML(h.horse_name)}</strong><small>${escapeHTML(h.sex)}${escapeHTML(h.age)} · ${escapeHTML(h.jockey)} · ${escapeHTML(h.carried_weight_kg)}kg</small></span><span class="arrow">›</span>`;b.onclick=()=>detail(h);$('horses').appendChild(b)}$('detailPanel').classList.add('hidden')}function detail(h){const fields=[['馬名',h.horse_name],['枠番 / 馬番',`${h.frame_number}枠 / ${h.horse_number}番`],['性齢・毛色',`${h.sex}${h.age}・${h.coat}`],['騎手 / 斤量',`${h.jockey} / ${h.carried_weight_kg}kg`],['調教師',`${h.trainer}（${h.training_center}）`],['父',h.sire],['母',h.dam],['母父',h.damsire],['単勝オッズ',h.win_odds?`${h.win_odds}倍（${h.popularity}番人気）`:'記録なし'],['馬固有ID',h.horse_id||'未取得']];let runs=db.runs.filter(x=>h.horse_id&&x.horse_id?x.horse_id===h.horse_id:x.horse_name===h.horse_name);$('details').innerHTML='<dl>'+fields.map(([a,b])=>`<dt>${escapeHTML(a)}</dt><dd>${escapeHTML(b||'—')}</dd>`).join('')+'</dl><h3>過去走</h3>'+(runs.length?runs.map(x=>`<div class="race">${escapeHTML(x.race_date)} ${escapeHTML(x.venue)} ${escapeHTML(x.race_name)}<br>${escapeHTML(x.finish_position)}着 / ${escapeHTML(x.field_size)}頭 · ${escapeHTML(x.surface)}${escapeHTML(x.distance_m)}m · 上がり ${escapeHTML(x.last_3f||'—')}</div>`).join(''):'<p class="muted">過去走データはありません（今回のサンプルは新馬戦です）。</p>');$('detailPanel').classList.remove('hidden');$('detailPanel').scrollIntoView({behavior:'smooth',block:'start'})}function commit(d){validate(d);db=d;localStorage.setItem(key,JSON.stringify(db));render();setStatus(`読み込み成功！ ${d.races.length}レース・${d.entries.length}頭・過去走${d.runs.length}件を保存しました。`)}$('import').onclick=async()=>{try{if(!$('races').files[0]||!$('entries').files[0])throw Error('レース情報と出走馬のCSVを選んでください');let d={races:parseCSV(await $('races').files[0].text()),entries:parseCSV(await $('entries').files[0].text()),runs:$('runs').files[0]?parseCSV(await $('runs').files[0].text()):[]};commit(d)}catch(e){setStatus(e.message,true)}};$('demo').onclick=async()=>{try{const files=['uma_lab_races.csv','uma_lab_entries.csv','uma_lab_past_runs.csv'];let responses=await Promise.all(files.map(f=>fetch(f)));if(responses.some(r=>!r.ok))throw Error('サンプルが見つかりません');let [races,entries,runs]=await Promise.all(responses.map(async r=>parseCSV(await r.text())));commit({races,entries,runs})}catch(e){setStatus('同梱サンプルを読み込めませんでした。GitHub Pagesなどで公開して試すか、CSVファイルを直接選択してください。',true)}};$('export').onclick=()=>{if(!db.races.length){setStatus('保存済みデータがありません',true);return}let url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='uma_lab_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('clear').onclick=()=>{if(!confirm('端末内のUMA LAB保存データを削除しますか？'))return;localStorage.removeItem(key);db={races:[],entries:[],runs:[]};$('results').classList.add('hidden');setStatus('保存データを削除しました')};try{let saved=localStorage.getItem(key);if(saved){let d=JSON.parse(saved);validate(d);db=d;render();setStatus('前回の保存データを復元しました')}}catch(e){setStatus('保存データを復元できませんでした。CSVから再読み込みしてください。',true)}
</script></body></html>
